version: "3"

vars:
  TAILWIND_VERSION: 4.3.3
  TAILWIND: ./bin/tailwindcss
  GOLANGCI_VERSION: 2.13.2
  GOLANGCI: ./bin/golangci-lint
  HTML_VALIDATE_VERSION: 10
  DATABASE_URL: '{{.DATABASE_URL | default "postgres://chat:chat@localhost:5432/chat?sslmode=disable"}}'
  CSS_IN: assets/css/globals.css
  CSS_OUT: assets/dist/styles.css

tasks:
  default:
    desc: List the tasks
    cmds:
      - task --list
    silent: true

  tools:
    desc: Download every pinned tool binary into ./bin
    deps: [tools:tailwind, tools:golangci]

  tools:tailwind:
    desc: Download the Tailwind binary into ./bin
    status:
      - test -x {{.TAILWIND}}
    cmds:
      - mkdir -p bin
      - |
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) asset=tailwindcss-linux-x64 ;;
          Linux-aarch64) asset=tailwindcss-linux-arm64 ;;
          Darwin-x86_64) asset=tailwindcss-macos-x64 ;;
          Darwin-arm64) asset=tailwindcss-macos-arm64 ;;
          *) echo "No Tailwind binary for $(uname -s) $(uname -m)." >&2; exit 1 ;;
        esac
        curl -fsSL -o {{.TAILWIND}} \
          "https://github.com/tailwindlabs/tailwindcss/releases/download/v{{.TAILWIND_VERSION}}/${asset}"
      - chmod +x {{.TAILWIND}}

  tools:golangci:
    desc: Download the golangci-lint binary into ./bin
    status:
      - test -x {{.GOLANGCI}}
      - "{{.GOLANGCI}} --version | grep -q ' {{.GOLANGCI_VERSION}} '"
    cmds:
      - mkdir -p bin
      - |
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) platform=linux-amd64 ;;
          Linux-aarch64) platform=linux-arm64 ;;
          Darwin-x86_64) platform=darwin-amd64 ;;
          Darwin-arm64) platform=darwin-arm64 ;;
          *) echo "No golangci-lint binary for $(uname -s) $(uname -m)." >&2; exit 1 ;;
        esac
        name="golangci-lint-{{.GOLANGCI_VERSION}}-${platform}"
        curl -fsSL \
          "https://github.com/golangci/golangci-lint/releases/download/v{{.GOLANGCI_VERSION}}/${name}.tar.gz" \
          | tar -xzf - -C bin --strip-components=1 "${name}/golangci-lint"
      - chmod +x {{.GOLANGCI}}

  db:up:
    desc: Start Postgres in the background
    cmds:
      - docker compose up --detach --wait

  db:down:
    desc: Stop Postgres and keep the data
    cmds:
      - docker compose down

  db:reset:
    desc: Stop Postgres and throw the data away
    prompt: This deletes every row in the local database. Go on?
    cmds:
      - docker compose down --volumes

  generate:
    desc: Generate Go code from the templ files
    cmds:
      - go tool templ generate

  css:
    desc: Build the stylesheet
    deps: [tools:tailwind]
    cmds:
      - "{{.TAILWIND}} --input {{.CSS_IN}} --output {{.CSS_OUT}} --minify"

  build:
    desc: Build the server binary
    cmds:
      - task: generate
      - task: css
      - go build -o chat ./cmd/chat

  dev:
    desc: Run the server and rebuild on every change
    deps: [tools:tailwind, generate, css]
    cmds:
      - |
        go tool templ generate --watch \
          --proxy=http://localhost:8080 \
          --open-browser=false \
          --cmd="go run ./cmd/chat" &
        {{.TAILWIND}} --input {{.CSS_IN}} --output {{.CSS_OUT}} --watch &
        wait

  test:
    desc: Run the tests
    deps: [generate]
    env:
      DATABASE_URL: "{{.DATABASE_URL}}"
    cmds:
      - go test ./...

  fmt:
    desc: Format the code
    deps: [tools:golangci]
    cmds:
      - go tool templ fmt .
      - "{{.GOLANGCI}} fmt"

  html:
    desc: Check the rendered markup with an HTML validator
    deps: [generate]
    cmds:
      - go run ./cmd/renderhtml tmp/html
      - npx --yes html-validate@{{.HTML_VALIDATE_VERSION}} "tmp/html/*.html"

  fix:
    desc: Apply the modernizations that go fix suggests
    deps: [generate]
    cmds:
      - go fix ./...

  lint:
    desc: Run the static checks
    deps: [tools:golangci, generate]
    cmds:
      # golangci-lint runs govet, so a separate go vet adds nothing.
      - "{{.GOLANGCI}} run"
