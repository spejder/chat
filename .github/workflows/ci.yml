name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat -d chat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://chat:chat@localhost:5432/chat?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: go-task/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache the tool binaries
        uses: actions/cache@v6
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}

      - name: Build
        run: task build

      - name: Make sure that the generated code is current
        run: git diff --exit-code

      - name: Test
        run: task test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: go-task/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache the tool binaries
        uses: actions/cache@v6
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}

      - name: Lint
        run: task lint

      - name: Format
        run: task fmt

      - name: Modernize
        run: task fix

      - name: Make sure that the format and the modernizers change nothing
        run: git diff --exit-code

  html:
    name: Validate the markup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: go-task/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the rendered markup
        run: task html

  image:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: go-task/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache the tool binaries
        uses: actions/cache@v6
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The same run as a release, but it publishes nothing. It catches a
      # broken build or a broken image before a tag exists.
      - name: Build a snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: go-task/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache the tool binaries
        uses: actions/cache@v6
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Taskfile.yml') }}

      - name: Build
        run: task build

      - name: Start the server
        run: |
          ./chat -addr :8080 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080 && exit 0
            sleep 1
          done
          echo "The server did not answer." >&2
          exit 1

      - name: Audit the page
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://localhost:8080/
          configPath: .github/lighthouserc.json
          uploadArtifacts: true
